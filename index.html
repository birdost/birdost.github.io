üçüüçşüşİş<!doctype html>
  <html lang="tr">
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Twinwing</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap">
  <style>
  *{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;font-family:"DM Mono",monospace;color:#eef2ff;background:#0A0E1A}
.card{max-width:560px;width:100%;text-align:center}
.glyph{width:96px;height:96px;margin:0 auto 26px;position:relative}
.glyph span{position:absolute;left:50%;width:56px;height:56px;border-radius:50%;transform:translateX(-50%)}
  .glyph .c{top:0;background:#2ee6c8;box-shadow:0 0 34px rgba(46,230,200,.65)}
.glyph .m{bottom:0;background:#ff4d8d;box-shadow:0 0 34px rgba(255,77,141,.65)}
.glyph i{position:absolute;top:50%;left:8%;right:8%;height:2px;background:rgba(255,255,255,.8);transform:translateY(-50%)}
h1{font-family:"Syne",sans-serif;font-weight:800;font-size:clamp(30px,8.5vw,54px);letter-spacing:1px;line-height:1}
h1 .c{color:#2ee6c8}
h1 .m{color:#ff4d8d}
.tag{margin-top:16px;font-size:15px;line-height:1.6;color:#aeb9d4}
.cta{display:inline-block;margin-top:30px;padding:16px 30px;border-radius:40px;font-family:"Syne",sans-serif;font-weight:800;font-size:17px;color:#06101e;text-decoration:none;background:linear-gradient(90deg,#2ee6c8,#ff4d8d)}
  .meta{margin-top:34px;padding-top:22px;border-top:1px solid #1d2740;font-size:13px;color:#8593ad;line-height:2}
.meta a{color:#7fe9d8;text-decoration:none}
</style>
  </head>
  <body>
  <main class="card">
  <div class="glyph"><span class="c"></span><span class="m"></span><i></i></div>
  <h1><span class="c">TWIN</span><span class="m">WING</span></h1>
  <p class="tag">İki kuş, tek dokunuş. Ama sağ taraf ayna gibi ters.<br>Neon refleks oyunu - çevrimdışı oynanır.</p>
